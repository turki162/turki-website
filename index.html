<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turki.dev</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Cairo', sans-serif;
}

body {
    background: #f9fbff;
    color: #0a0a0a;
    overflow-x: hidden;
}

/* Mouse Glow */
.glow {
    position: fixed;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(0,123,255,0.2), transparent 60%);
    pointer-events: none;
    transform: translate(-50%, -50%);
}

/* Header */
header {
    padding: 30px 8%;
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;
}

/* Hero */
.hero {
    padding: 100px 8%;
}

.hero h1 {
    font-size: 60px;
    font-weight: 900;
}

.highlight {
    background: linear-gradient(90deg, #007bff, #00c6ff);
    -webkit-background-clip: text;
    color: transparent;
}

.type {
    font-size: 22px;
    margin-top: 15px;
    opacity: 0.7;
}

/* Button */
.btn {
    margin-top: 30px;
    display: inline-block;
    padding: 14px 30px;
    border-radius: 30px;
    background: linear-gradient(90deg, #007bff, #00c6ff);
    color: white;
    text-decoration: none;
    transition: 0.3s;
}

.btn:hover {
    transform: translateY(-4px);
}

/* Sections */
section {
    padding: 80px 8%;
}

.section-title {
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 30px;
}

/* Skills */
.skills {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap: 20px;
}

.skill {
    background: white;
    padding: 20px;
    border-radius: 14px;
    transition: 0.3s;
}

.skill:hover {
    transform: translateY(-8px);
}

/* Footer */
footer {
    text-align: center;
    padding: 40px;
    opacity: 0.5;
}
</style>
</head>

<body>

<div class="glow" id="glow"></div>

<header>
    <div class="logo">TURKI.DEV</div>
</header>

<section class="hero">
    <h1>أنا <span class="highlight">تركي</span></h1>
    <div class="type" id="type"></div>
    <a href="mailto:trke_max@icloud.com" class="btn">تواصل معي</a>
</section>

<section>
    <div class="section-title">نبذة</div>
    <p>
        أبني حلول تقنية تجمع بين الأداء العالي والتصميم الجريء. أركز على التفاصيل،
        وأحوّل الأفكار إلى منتجات رقمية لها تأثير فعلي.
    </p>
</section>

<section>
    <div class="section-title">المهارات</div>
    <div class="skills">
        <div class="skill">Front-End & Back-End</div>
        <div class="skill">Python</div>
        <div class="skill">UI/UX Design</div>
        <div class="skill">أنظمة الآلات الدقيقة</div>
    </div>
</section>

<footer>
    © 2026 Turki.dev
</footer>

<script>
// Mouse Glow
document.addEventListener("mousemove", e => {
    const glow = document.getElementById("glow");
    glow.style.left = e.clientX + "px";
    glow.style.top = e.clientY + "px";
});

// Typewriter
const text = ["مطور ويب", "مبرمج Python", "حلول تقنية ذكية"];
let i = 0, j = 0, current = "", isDeleting = false;

function type() {
    current = text[i];
    document.getElementById("type").textContent =
        current.substring(0, j);

    if (!isDeleting && j < current.length) {
        j++;
    } else if (isDeleting && j > 0) {
        j--;
    } else {
        isDeleting = !isDeleting;
        if (!isDeleting) i = (i + 1) % text.length;
    }

    setTimeout(type, isDeleting ? 50 : 100);
}
type();
</script>

</body>
</html>
